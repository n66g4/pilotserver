# pilotserver Nginx 示例配置
# 粘贴到现有 nginx.conf 的 http {} 与 stream {} 段，或 include 进 sites-enabled。
# 替换 op.example.com、证书路径与数据目录。

# ---- HTTP/HTTPS（放入 http {} 内）----

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name op.example.com;

    # ssl_certificate     /etc/letsencrypt/live/op.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/op.example.com/privkey.pem;

    client_max_body_size 1024m;

    # 管理端静态页（Go 内嵌，也可改 Nginx 直出）
    location /admin/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Athena WebSocket（/ws/v2/{dongle_id}、/ws/proxy/{ticket}）
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 可选：OTA 大文件由 Nginx 直出
    # location /ota/files/ {
    #     alias /var/lib/pilotserver/data/ota/files/;
    # }

    # 可选：Cabana 静态（第二期，见 web/cabana/README.md）
    # location /cabana/ {
    #     alias /var/lib/pilotserver/web/cabana/dist/;
    # }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# HTTP 重定向到 HTTPS（可选）
# server {
#     listen 80;
#     listen [::]:80;
#     server_name op.example.com;
#     return 301 https://$host$request_uri;
# }

